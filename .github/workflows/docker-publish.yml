name: Build, Scan, Push
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          missing=""
          if [ -z "$DOCKER_USERNAME" ]; then
            missing="DOCKER_USERNAME"
          fi
          if [ -z "$DOCKER_PAT" ]; then
            if [ -n "$missing" ]; then
              missing="$missing DOCKER_PAT"
            else
              missing="DOCKER_PAT"
            fi
          fi
          if [ -n "$missing" ]; then
            echo "::error::Docker Scout requires Docker Hub auth. Set repository secret(s): $missing"
            exit 1
          fi

      - name: Log in to Docker Hub
        id: docker_login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Report Docker Hub auth failure
        if: failure() && steps.docker_login.outcome == 'failure'
        run: |
          echo "::error::Docker Hub rejected repository secrets DOCKER_USERNAME and DOCKER_PAT. Docker Scout needs a valid Docker Hub username and access token. No image is pushed until that login succeeds and the CVE scan passes."
          exit 1

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Scout CVE gate
        id: docker_scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          only-severities: critical,high
          exit-code: true

      - name: Push image
        if: steps.docker_scout.outcome == 'success'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            docker push "$tag"
          done <<< "$TAGS"
