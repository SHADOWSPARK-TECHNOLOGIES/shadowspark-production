name: regen-lockfile-pr-a
on:
  push:
    branches: [fix/next-auth-beta-32]
    paths:
      - .github/workflows/regen-lockfile-pr-a.yml
  workflow_dispatch:
jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/next-auth-beta-32
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Restore base lockfile then refresh
        run: |
          git checkout 07d2d7fd -- pnpm-lock.yaml || true
          pnpm install --no-frozen-lockfile
      - name: Verify next-auth pins
        run: |
          set -e
          grep -q "next-auth@5.0.0-beta.32" pnpm-lock.yaml
          grep -q "@auth/core@0.41.3\|auth/core@0.41.3" pnpm-lock.yaml
          echo "pins ok"
      - name: Commit lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/regen-lockfile-pr-a.yml
          git add pnpm-lock.yaml
          git add -u .github/workflows/regen-lockfile-pr-a.yml || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(deps): refresh lockfile for next-auth 5.0.0-beta.32"
          git push origin HEAD:fix/next-auth-beta-32
